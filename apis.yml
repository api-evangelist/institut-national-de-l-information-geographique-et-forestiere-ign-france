name: Institut National de l'information geographique et forestiere (IGN - France)

description: The Institut National de l'Information Géographique et Forestière (IGN) is France's national mapping agency, providing free public
  access to a wide range of geographic data, maps, and cartographic services. It offers APIs for geospatial data, map tiles, elevation models,
  and location-based services, supporting developers, researchers, and public administrations in building location-aware applications. The IGN
  promotes open data, ensuring that geographic information is freely accessible and reusable for societal benefit.

